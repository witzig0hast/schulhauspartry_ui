# WireGuard NUR im Container (kein Host-VPN, keine DNS-Aenderung am Server).
# Die App teilt sich den Netzwerk-Namespace des wg-Containers; nur dessen Tunnel-Interface nutzt sie fuer 10.8.0.0/24.
# Aufruf: docker compose -f docker-compose.yml -f docker-compose.npm.yml -f docker-compose.vpn.yml up -d
services:
  wg:
    image: lscr.io/linuxserver/wireguard:latest
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      SERVERPORT: 51820
      PEERS: pi,pc                       # pi = Veranstaltungs-Pi, pc = dein Rechner (Windows/Mac/Linux WireGuard-Client)
      INTERNAL_SUBNET: 10.8.0.0
      PEERDNS: ""            # kein DNS ueberschreiben
      SERVERURL: ${WG_SERVERURL:-auto}   # Domain/IP, unter der der Pi den Server erreicht (DNS-only, nicht ueber Cloudflare-Proxy)
      ALLOWEDIPS: 10.8.0.0/24            # Pi und PC routen NUR das Tunnelnetz
      SERVER_ALLOWEDIPS_PEER_pi: 10.8.0.192/26   # hinter dem Pi liegende Geraete (virtuelle Adressen, z. B. X32 = 10.8.0.200)
    volumes:
      - wg-config:/config
    ports:
      - "51820:51820/udp"   # am Router/Hetzner-Firewall freigeben; DNS-Eintrag NICHT ueber Cloudflare-Proxy
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    networks: [npm]
  # Verwaltungsdienst fuer die Oberflaeche (Admin -> VPN): teilt sich das Netzwerk mit wg, lauscht nur auf 127.0.0.1 und verlangt ein Token
  wgctl:
    build: ./wgctl
    restart: unless-stopped
    network_mode: "service:wg"
    cap_add: [NET_ADMIN]
    depends_on: [wg]
    environment:
      WGCTL_TOKEN: ${WGCTL_TOKEN:-}
      WG_SERVERURL: ${WG_SERVERURL:-}
      WG_PORT: "51820"
    volumes:
      - wg-config:/config
  app:
    network_mode: "service:wg"
    networks: !reset null
    depends_on: [wg]
    environment:
      WGCTL_TOKEN: ${WGCTL_TOKEN:-}
volumes:
  wg-config:
