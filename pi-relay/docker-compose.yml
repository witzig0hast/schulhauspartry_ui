# Zwei Betriebsarten (autonet.sh waehlt beim Start und alle 30 s automatisch):
#   lan  = Server im selben Netz -> Relay direkt im Netz des Pi, KEIN VPN
#   vpn  = Server woanders       -> WireGuard laeuft NUR im Container "wg"; das Relay haengt sich in dessen Netzwerk.
#          Das Netzwerk des Pi selbst (SSH, X32, Internet) bleibt unveraendert.
services:
  relay-lan:
    profiles: [lan]
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      BIND: 0.0.0.0

  wg:
    profiles: [vpn]
    image: lscr.io/linuxserver/wireguard:latest
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
    volumes:
      - ./wg:/config/wg_confs
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1

  relay-vpn:
    profiles: [vpn]
    build: .
    restart: unless-stopped
    network_mode: "service:wg"     # teilt sich das Netzwerk mit dem VPN-Container (Port 8080 gibt es nur im Tunnel)
    depends_on:
      wg:
        condition: service_started
        restart: true
    env_file: .env
    environment:
      BIND: 0.0.0.0
