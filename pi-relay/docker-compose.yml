# Das Relay laeuft direkt im Netzwerk des Pi (host). Das VPN (WireGuard) laeuft auf dem Pi selbst und wird von autonet.sh
# automatisch an-/ausgeschaltet: zu Hause aus, woanders an. Ports sind per Firewall (ufw) geschuetzt, das Relay verlangt zusaetzlich ein Token.
services:
  relay:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      BIND: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8080}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
